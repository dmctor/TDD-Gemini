# Reemplaza <ORG> y <PROJECT_KEY> por los valores de tu organizacion en SonarQube Cloud.
sonar.projectKey=<PROJECT_KEY>
sonar.organization=<ORG>
sonar.projectName=Proveedify - TDD + GAI
sonar.projectVersion=1.0

sonar.sources=lib
sonar.tests=test
